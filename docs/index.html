  <script>
    try { window.Telegram.WebApp.ready(); } catch (e) {}
    // theme before the first paint, so a dark-theme user never sees a white flash
    (function () {
      var s = {};
      try { s = JSON.parse(localStorage.getItem('musique.settings')) || {}; } catch (e) {}
      var w = window.Telegram && window.Telegram.WebApp;
      // custom colour themes: [light background, dark background] — the same table as THEMES in js/themes.js
      var key = { oldmoney: 'richesse' }[s.colorTheme] || s.colorTheme; // a renamed theme (js/store.js migrates the setting itself)
      var custom = { navy: ['#F3EBDA', '#0F1A2E'],
        noir: ['#F2F2F0', '#121212'],
        bordo: ['#F6ECE6', '#4A121C'],
        green: ['#F1EDDD', '#12261D'],
        richesse: ['#F4EFE3', '#0F1A14'],
        obsidian: ['#EEF3F0', '#0D1110'],
        terracotta: ['#F6EBDD', '#211714'],
        tuscan: ['#F2E8D6', '#1C231C'],
        ussr: ['#F1E6CC', '#2A0F10'],
        ddr: ['#EDE8DC', '#151515'],
        eighties: ['#FFEFF6', '#1A1033'],
        depression: ['#EDE3CF', '#1E1712'] }[key];
      // Auto / Light / Dark applies to every theme; Auto follows Telegram or the system. Until js/store.js has migrated the
      // settings (once), a theme is shown in the mode it was drawn in, as it always was
      var mode = s.theme && s.theme !== 'system' ? s.theme
        : (w && w.colorScheme) || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      if (!s.themeModeSet && {navy: 'dark', noir: 'dark', bordo: 'dark', green: 'dark', richesse: 'light', obsidian: 'dark', terracotta: 'dark', tuscan: 'light', ussr: 'light'}[key]) mode = {navy: 'dark', noir: 'dark', bordo: 'dark', green: 'dark', richesse: 'light', obsidian: 'dark', terracotta: 'dark', tuscan: 'light', ussr: 'light'}[key];
      var theme = custom ? key : mode;
      var root = document.documentElement;
      root.dataset.player = s.playerMode || 'record';
      root.dataset.theme = theme;
      root.dataset.mode = mode;
      if (s.recordColor && s.recordColor !== 'black') root.dataset.vinyl = s.recordColor;
      if (s.playerMode === 'cassette' || s.playerMode === 'reel') root.dataset.family = 'tape'; // the launch screen shows a cassette then
      if (s.tapeColor && s.tapeColor !== 'black') root.dataset.tape = s.tapeColor;
      var bg = custom ? custom[mode === 'dark' ? 1 : 0] : mode === 'dark' ? '#1A1410' : '';
      if (bg) document.querySelector('meta[name="theme-color"]').content = bg;
    })();
  </script>

       chosen player (the script after .boot), the screens' loaders too (ui.js loader()). Flat shapes, CSS animations -->

      <g class="ml-spin ml-spin--slow"><circle class="ml-reel" cx="100" cy="38" r="25"/><circle class="ml-wound" cx="100" cy="38" r="11"/>
        <circle class="ml-hole" cx="100" cy="27" r="4.5"/><circle class="ml-hole" cx="90.5" cy="43.5" r="4.5"/><circle class="ml-hole" cx="109.5" cy="43.5" r="4.5"/><circle class="ml-hub" cx="100" cy="38" r="3.5"/></g>
      <rect class="ml-accent" x="58" y="76" width="24" height="10" rx="2"/>
      <g class="ml-vu"><circle cx="70" cy="18" r="5"/></g>
    </svg></div>

      <g class="ml-spin ml-spin--fast"><circle class="ml-disc" cx="60" cy="60" r="42"/>
        <path class="ml-hue ml-hue--1" d="M60 60 L60 18 A42 42 0 0 1 96.4 39 Z"/><path class="ml-hue ml-hue--2" d="M60 60 L96.4 81 A42 42 0 0 1 60 102 Z"/>
        <path class="ml-hue ml-hue--3" d="M60 60 L23.6 81 A42 42 0 0 1 23.6 39 Z"/>

  <div class="boot" role="status" aria-label="Musique"><div class="vl" aria-hidden="true"><div class="vl__slide"><div class="vl__disc"><span class="vl__groove"></span><span class="vl__label"></span></div></div><div class="vl__sleeve"><span class="vl__brand">Musique</span></div></div><div class="tl" aria-hidden="true"><div class="tl__shell"><span class="tl__label"></span><span class="tl__win"><i class="tl__reel"></i><i class="tl__reel"></i></span></div></div></div>
  <script>
    // the launch screen of the reels, the CD player, the phonograph and the radios: their own picture from #ml-art
    (function () {
      var p = document.documentElement.dataset.player, t = document.getElementById('ml-art');
      var art = t && t.content.querySelector('.ml--' + p);
      if (art) { var boot = document.querySelector('.boot'); boot.classList.add('boot--ml'); boot.prepend(art.cloneNode(true)); }
    })();
  </script>
  <main id="main"></main>
  <div id="mini" class="mini" role="button" aria-label="player"></div>
  <nav id="nav" class="nav"></nav>
  <script>
    // If the app never replaces the placeholder, say why on screen (no devtools inside Telegram)
    (function () {
      var errs = [];
      function note(m) { errs.push(String(m).slice(0, 160)); }
      window.addEventListener('error', function (e) { note((e.message || 'error') + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : '')); });
      window.addEventListener('unhandledrejection', function (e) { note('promise: ' + (e.reason && e.reason.message || e.reason)); });
      window.__musiqueNote = note;
      setTimeout(function () {
        var b = document.querySelector('.boot');
        if (!b || !b.isConnected) return;
        if (window.__musiqueStarted && !errs.length) {
          var n = document.createElement('div');
          n.className = 'boot__note';
          n.textContent = 'Подключение к серверу…';
          b.appendChild(n);
          return;
        }
        var info = ['Загрузка не завершилась', 'app.js: ' + (window.__musiqueStarted ? 'запущен' : 'не запустился'), 'Telegram SDK: ' + (window.Telegram && window.Telegram.WebApp ? 'ok' : 'нет')]
          .concat(errs.length ? errs : ['ошибок не поймано — скрипт, вероятно, не загрузился']);
        b.style.cssText = 'padding:24px;color:var(--text);font:14px/1.5 sans-serif;white-space:pre-wrap;word-break:break-word';
        b.textContent = info.join('\n');
      }, 8000);
      // ?musique_debug=1: overlay with load timings, for debugging inside Telegram clients where devtools are unavailable
      if (/[?&]musique_debug=1/.test(location.search)) setTimeout(function () {
        var lines = performance.getEntriesByType('resource').map(function (e) {
          return Math.round(e.startTime) + '+' + Math.round(e.duration) + ' ' + (e.responseStatus || '') + ' ' + e.name.replace(/^https:\/\/[^/]+/, '').split('?')[0].slice(-40);
        });
        var nav = performance.getEntriesByType('navigation')[0];
        lines.unshift('dom ' + Math.round(nav ? nav.domContentLoadedEventEnd : 0) + ' ms, started ' + !!window.__musiqueStarted);
        var d = document.createElement('pre');
        d.style.cssText = 'position:fixed;inset:auto 0 0 0;max-height:60vh;overflow:auto;margin:0;padding:8px;background:#fff;color:#000;font:10px/1.3 monospace;z-index:99999';
        d.textContent = lines.join('\n');
        document.body.appendChild(d);
      }, 25000);
    })();
  </script>
  <script type="module" src="js/app.js?v=82" onerror="window.__musiqueNote('не удалось загрузить js/app.js')"></script>
