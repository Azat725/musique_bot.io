<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>Musique</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- fonts must never block rendering: if Google is unreachable the system fonts are used -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap&subset=cyrillic" rel="stylesheet" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="css/tokens.css?v=5">
  <link rel="stylesheet" href="css/app.css?v=5">
  <link rel="stylesheet" href="css/player.css?v=5">
  <!-- local copy of https://telegram.org/js/telegram-web-app.js?64 (taken 2026-10-29): telegram.org hangs on some networks/VPNs, and the app module waits for this script -->
  <script src="vendor/telegram-web-app.js?v=1"></script>
  <script>try { window.Telegram.WebApp.ready(); } catch (e) {}</script>
</head>
<body>
  <main id="main"><div class="boot" style="display:flex;align-items:center;justify-content:center;height:60vh;color:#7B1E2B;font:600 22px Georgia,serif;letter-spacing:.04em">Musique</div></main>
  <div id="mini" class="mini" role="button" aria-label="player"></div>
  <nav id="nav" class="nav"></nav>
  <script>
    // If the app never replaces the placeholder, say why on screen (no devtools inside Telegram)
    (function () {
      var errs = [];
      function note(m) { errs.push(String(m).slice(0, 160)); }
      window.addEventListener('error', function (e) { note((e.message || 'error') + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : '')); });
      window.addEventListener('unhandledrejection', function (e) { note('promise: ' + (e.reason && e.reason.message || e.reason)); });
      window.__musiqueNote = note;
      setTimeout(function () {
        var b = document.querySelector('.boot');
        if (!b || !b.isConnected) return;
        if (window.__musiqueStarted && !errs.length) { b.textContent = 'Подключение к серверу…'; return; }
        var info = ['Загрузка не завершилась', 'app.js: ' + (window.__musiqueStarted ? 'запущен' : 'не запустился'), 'Telegram SDK: ' + (window.Telegram && window.Telegram.WebApp ? 'ok' : 'нет')]
          .concat(errs.length ? errs : ['ошибок не поймано — скрипт, вероятно, не загрузился']);
        b.style.cssText = 'padding:24px;color:#14213D;font:14px/1.5 sans-serif;white-space:pre-wrap;word-break:break-word';
        b.textContent = info.join('\n');
      }, 8000);
      // ?dbg=1: overlay with load timings, for debugging inside Telegram clients where devtools are unavailable
      if (/[?&]dbg=1/.test(location.search)) setTimeout(function () {
        var lines = performance.getEntriesByType('resource').map(function (e) {
          return Math.round(e.startTime) + '+' + Math.round(e.duration) + ' ' + (e.responseStatus || '') + ' ' + e.name.replace(/^https:\/\/[^/]+/, '').split('?')[0].slice(-40);
        });
        lines.unshift('dom ' + Math.round(performance.timing.domContentLoadedEventEnd - performance.timing.navigationStart) + ' ms, started ' + !!window.__musiqueStarted + ', marks ' + JSON.stringify(window.__musiqueMarks || {}));
        var d = document.createElement('pre');
        d.style.cssText = 'position:fixed;inset:auto 0 0 0;max-height:60vh;overflow:auto;margin:0;padding:8px;background:#fff;color:#000;font:10px/1.3 monospace;z-index:99999';
        d.textContent = lines.join('\n');
        document.body.appendChild(d);
      }, 25000);
    })();
  </script>
  <script type="module" src="js/app.js?v=11" onerror="window.__musiqueNote('не удалось загрузить js/app.js')"></script>
</body>
</html>
