name: Check and publish
on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check && npm test && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          TEST_DIST: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report
          path: playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: dist/
          include-hidden-files: true
          retention-days: 7
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BOT_TOKEN: '123456789:TEST_ONLY_NOT_A_REAL_TELEGRAM_TOKEN'
      DATA_DIR: /tmp/musique-test
      ENV_FILE: /dev/null
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r server/requirements.txt
      - run: python -m compileall -q server
      - run: bash -n scripts/deploy-server.sh
      - run: python -m unittest discover -s tests/server -v
      - run: python -c "from server.api import app; assert any(r.path == '/api/radio' for r in app.routes)"
      - run: docker build -t musique-ci .
  pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: static-site
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: publish
